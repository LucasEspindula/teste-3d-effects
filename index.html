import * as THREE from 'three';

const FBX_URL = './assets/chest.fbx';;
const MOB_FBX_URL = './assets/mobs/alien.fbx';
const TEX = {"base":"./assets/base.png","normal":"./assets/normal.png","metallic":"./assets/metallic.png","roughness":"./assets/roughness.png","ao":"./assets/ao.png","height":"./assets/height.png"};
const app = document.querySelector('#app');
const loading = document.querySelector('#loading');
const errorBox = document.querySelector('#error');
const lootBox = document.querySelector('#loot');
const rarityEl = document.querySelector('#rarity');
const itemEl = document.querySelector('#item');
const descEl = document.querySelector('#desc');
const lootIconEl = document.querySelector('#lootIcon');
const collectionBtn=document.querySelector('#collectionBtn'),collectionEl=document.querySelector('#collection'),collectionGrid=document.querySelector('#collectionGrid'),collectionCount=document.querySelector('#collectionCount');
let collection=[];
try{collection=JSON.parse(localStorage.getItem('treasureCollection')||'[]')}catch(e){}
function renderCollection(){
  collectionCount.textContent=collection.length;
  collectionGrid.innerHTML=collection.length?collection.map(x=>`<div class="collection-item"><div class="ico">${x.icon}</div><div><strong style="color:${x.c}">${x.name}</strong><small>${x.r} • x${x.qty}</small></div></div>`).join(''):'<div class="collection-empty">Abra o baú para começar sua coleção.</div>';
}
function saveLoot(item){
  const found=collection.find(x=>x.name===item.name);
  if(found)found.qty++;else collection.push({name:item.name,r:item.r,c:item.c,icon:item.icon,qty:1});
  localStorage.setItem('treasureCollection',JSON.stringify(collection));renderCollection();
}
collectionBtn.addEventListener('click',()=>collectionEl.classList.toggle('show'));
renderCollection();

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080914, .075);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .05, 100);
camera.position.set(3.2,2.25,4.8);

const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
app.appendChild(renderer.domElement);

// Controle em primeira pessoa: o jogador não orbita mais preso ao baú.
const controls = new OrbitControls(camera, renderer.domElement);
controls.enabled=false;
camera.position.set(0,.62,4.25);
camera.rotation.order='YXZ';
let yaw=0,pitch=-.08,pointerLocked=false;
const keys={};
const playerHeight=.62, moveSpeed=2.15, worldRadius=5.4;
function applyLook(){camera.rotation.y=yaw;camera.rotation.x=pitch}
applyLook();
renderer.domElement.addEventListener('click',()=>{if(!pointerLocked)renderer.domElement.requestPointerLock?.()});
document.addEventListener('pointerlockchange',()=>{pointerLocked=document.pointerLockElement===renderer.domElement});
document.addEventListener('mousemove',e=>{if(!pointerLocked)return;yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=THREE.MathUtils.clamp(pitch,-1.35,1.35);applyLook()});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&!e.repeat)tryInteract()});
addEventListener('keyup',e=>keys[e.code]=false);
let cinematicBasePos=camera.position.clone(), cinematicBaseTarget=new THREE.Vector3();
let cinematicUntil=0, cinematicStrength=0;
const rarityPower={COMUM:.72,RARO:.9,'ÉPICO':1.12,'LENDÁRIO':1.42,'???':1.65};
let audioCtx=null;
function tone(freq,duration,type='sine',gain=.035,delay=0){
  try{
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(45,freq*.72),t+duration);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.03);
  }catch(e){}
}
function playLootSound(rarity){
  tone(105,.16,'triangle',.045,0);tone(72,.24,'sine',.055,.08);
  const notes=rarity==='LENDÁRIO'?[523,659,784,1047]:rarity==='ÉPICO'?[392,523,659]:rarity==='RARO'?[330,440]:rarity==='???'?[95,72,55]:[262];
  notes.forEach((n,i)=>tone(n,.28,rarity==='???'?'sawtooth':'sine',rarity==='???'?.035:.028,.2+i*.075));
}
function beginCinematic(rarity){
  // Em primeira pessoa a câmera pertence sempre ao jogador.
  // Mantemos os efeitos/sons de raridade sem sequestrar a visão.
  cinematicStrength=rarityPower[rarity]||1;cinematicUntil=0;
}

renderer.domElement.style.cursor='crosshair';

const hemi = new THREE.HemisphereLight(0x8ea3ff,0x2b1308,1.65); scene.add(hemi);
const key = new THREE.SpotLight(0xffd28a,75,14,Math.PI*.26,.55,1.6); key.position.set(3.5,5,4.3); key.castShadow=true; key.shadow.mapSize.set(1024,1024); scene.add(key);
const rim = new THREE.SpotLight(0x786dff,95,12,Math.PI*.34,.75,1.2); rim.position.set(-4.3,3.6,-3.5); scene.add(rim);
const warm = new THREE.PointLight(0xff8d38,10,5,2); warm.position.set(0,-.5,1); scene.add(warm);

const ground = new THREE.Mesh(new THREE.CircleGeometry(3.25,96),new THREE.MeshStandardMaterial({color:0x0b0c14,roughness:.85,metalness:.08,transparent:true,opacity:.78}));
ground.rotation.x=-Math.PI/2; ground.position.y=-1.04; ground.receiveShadow=true; scene.add(ground);
const ring = new THREE.Mesh(new THREE.RingGeometry(1.25,1.31,96),new THREE.MeshBasicMaterial({color:0xd98a34,transparent:true,opacity:.2,side:THREE.DoubleSide})); ring.rotation.x=-Math.PI/2; ring.position.y=-1.025; scene.add(ring);

// Ambiente mais limpo: o baú fica como protagonista, cercado por pedras baixas e brasas.
const envGroup=new THREE.Group();scene.add(envGroup);
const stoneMat=new THREE.MeshStandardMaterial({color:0x171923,roughness:.94,metalness:.04});
const trimMat=new THREE.MeshStandardMaterial({color:0x4d3825,roughness:.72,metalness:.28});
const dais=new THREE.Mesh(new THREE.CylinderGeometry(2.28,2.5,.22,12),stoneMat);dais.position.y=-1.15;dais.receiveShadow=true;envGroup.add(dais);
const daisTrim=new THREE.Mesh(new THREE.TorusGeometry(2.22,.025,7,72),trimMat);daisTrim.rotation.x=Math.PI/2;daisTrim.position.y=-1.025;envGroup.add(daisTrim);
const debris=[];
[
 [-2.15,-.99,-1.45,.42,.18,.28,.25],[2.0,-1.0,-1.5,.5,.15,.3,-.32],
 [-2.32,-1.0,.92,.34,.17,.45,.5],[2.25,-1.0,.82,.4,.2,.32,-.55],
 [-1.42,-1.0,-2.0,.28,.13,.5,.16],[1.25,-1.0,-2.1,.46,.14,.25,-.18]
].forEach(([x,y,z,w,h,d,r])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),stoneMat);m.position.set(x,y,z);m.rotation.set(0,r,(Math.random()-.5)*.12);m.castShadow=true;m.receiveShadow=true;envGroup.add(m);debris.push(m)});
const emberMat=new THREE.PointsMaterial({size:.035,color:0xff8a38,transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending});
const emberGeo=new THREE.BufferGeometry(),emberPos=new Float32Array(54);
for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,r=1.7+Math.random()*.75;emberPos[i*3]=Math.cos(a)*r;emberPos[i*3+1]=-.92+Math.random()*.16;emberPos[i*3+2]=Math.sin(a)*r}
emberGeo.setAttribute('position',new THREE.BufferAttribute(emberPos,3));const embers=new THREE.Points(emberGeo,emberMat);envGroup.add(embers);

function decodeBase64(b64){const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return bytes.buffer}
const tLoader = new THREE.TextureLoader();
function tex(src,srgb=false){const t=tLoader.load(src);t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t}
const baseMap=tex(TEX.base,true), normalMap=tex(TEX.normal), metalMap=tex(TEX.metallic), roughMap=tex(TEX.roughness), aoMap=tex(TEX.ao), heightMap=tex(TEX.height);
const chestMat = new THREE.MeshStandardMaterial({map:baseMap,normalMap,metalnessMap:metalMap,roughnessMap:roughMap,aoMap,metalness:1,roughness:1,normalScale:new THREE.Vector2(.92,.92),bumpMap:heightMap,bumpScale:.018});
chestMat.envMapIntensity=1.0;
const innerMat = new THREE.MeshStandardMaterial({color:0x2f1d12,roughness:.96,metalness:.05,side:THREE.DoubleSide});
innerMat.envMapIntensity=.35;

const chestFloat = new THREE.Group(); scene.add(chestFloat);
const chestRoot = new THREE.Group(); chestFloat.add(chestRoot);
const bodyGroup = new THREE.Group(); chestRoot.add(bodyGroup);
const lidPivot = new THREE.Group(); chestRoot.add(lidPivot);
const lidGroup = new THREE.Group(); lidPivot.add(lidGroup);
const hitMeshes=[];
let closedRot=0, openTarget=0, openProgress=0, ready=false;
let chestSize = new THREE.Vector3(2,2,2);

function copyTri(src,i,arrs){
  const pos=src.getAttribute('position'), nor=src.getAttribute('normal'), uv=src.getAttribute('uv');
  for(let k=0;k<3;k++){
    const n=i+k; arrs.p.push(pos.getX(n),pos.getY(n),pos.getZ(n));
    if(nor) arrs.n.push(nor.getX(n),nor.getY(n),nor.getZ(n));
    if(uv) arrs.u.push(uv.getX(n),uv.getY(n));
  }
}
function makeGeom(arrs){
  if(!arrs.p.length)return null; const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(arrs.p,3));
  if(arrs.n.length)g.setAttribute('normal',new THREE.Float32BufferAttribute(arrs.n,3)); else g.computeVertexNormals();
  if(arrs.u.length){g.setAttribute('uv',new THREE.Float32BufferAttribute(arrs.u,2));g.setAttribute('uv1',new THREE.Float32BufferAttribute(arrs.u.slice(),2));}
  g.computeBoundingBox();g.computeBoundingSphere();return g;
}
function splitGeometry(geometry,splitY){
  let g=geometry.index?geometry.toNonIndexed():geometry.clone();
  const p=g.getAttribute('position'); const top={p:[],n:[],u:[]},bot={p:[],n:[],u:[]};
  for(let i=0;i<p.count;i+=3){const cy=(p.getY(i)+p.getY(i+1)+p.getY(i+2))/3;copyTri(g,i,cy>=splitY?top:bot)}
  return {top:makeGeom(top),bottom:makeGeom(bot)};
}
function buildLidLining(size, splitY, maxY){
  const g = new THREE.Group();
  // Seção interna em arco: em vez de uma placa reta, cria uma meia-cana tipo "C".
  // O arco corre no eixo X (profundidade) e é extrudado pela largura Z do baú.
  const widthZ = Math.max(.1, size.z * .84);
  const radiusX = Math.max(.08, size.x * .43);
  const radiusY = Math.max(.08, (maxY - splitY) * .82);
  const centerY = splitY + (maxY - splitY) * .12;
  const segments = 18;
  const positions = [];
  const uvs = [];
  for(let i=0;i<segments;i++){
    const a0 = Math.PI * i/segments;
    const a1 = Math.PI * (i+1)/segments;
    const x0 = Math.cos(a0)*radiusX, y0 = centerY + Math.sin(a0)*radiusY;
    const x1 = Math.cos(a1)*radiusX, y1 = centerY + Math.sin(a1)*radiusY;
    const z0 = -widthZ*.5, z1 = widthZ*.5;
    positions.push(x0,y0,z0, x0,y0,z1, x1,y1,z1, x0,y0,z0, x1,y1,z1, x1,y1,z0);
    const u0=i/segments,u1=(i+1)/segments;
    uvs.push(u0,0,u0,1,u1,1, u0,0,u1,1,u1,0);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo,innerMat);
  mesh.receiveShadow=true;
  g.add(mesh);
  return g;
}

function buildInnerLining(size, splitY, minY){
  const g = new THREE.Group();
  // Afina menos as bordas para o forro interno ocupar mais espaço lateral.
  const insetX = Math.max(size.x*.085, .045);
  const insetZ = Math.max(size.z*.075, .045);
  const floorInset = Math.max(size.y*.06, .035);
  const wallTopInset = Math.max(size.y*.045, .03);
  const innerDepth = Math.max(.1, size.x - insetX*2);
  const innerWidth = Math.max(.1, size.z - insetZ*2);
  const innerHeight = Math.max(.08, (splitY-minY) - floorInset - wallTopInset);
  const floorY = (minY + floorInset);
  const wallCenterY = floorY + innerHeight*.5;
  const mk = (geo,x,y,z,rx=0,ry=0,rz=0) => {
    const m = new THREE.Mesh(geo, innerMat);
    m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
    m.castShadow=false; m.receiveShadow=true;
    g.add(m);
    return m;
  };
  mk(new THREE.PlaneGeometry(innerWidth, innerDepth), 0, floorY, 0, -Math.PI/2, 0, 0);
  mk(new THREE.PlaneGeometry(innerWidth, innerHeight), 0, wallCenterY, -size.x*.5 + insetX, 0, 0, 0);
  mk(new THREE.PlaneGeometry(innerWidth, innerHeight), 0, wallCenterY,  size.x*.5 - insetX, 0, Math.PI, 0);
  mk(new THREE.PlaneGeometry(innerDepth, innerHeight), -size.z*.5 + insetZ, wallCenterY, 0, 0,  Math.PI/2, 0);
  mk(new THREE.PlaneGeometry(innerDepth, innerHeight),  size.z*.5 - insetZ, wallCenterY, 0, 0, -Math.PI/2, 0);
  // O FBX usa X/Z invertidos em relação ao revestimento que montamos.
  // Gira somente o interior 90° para ele encaixar no volume do baú.
  g.rotation.y = Math.PI / 2;
  return g;
}

try{
  const manager=new THREE.LoadingManager();
  const transparent='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADElEQVR42mNk+M8AAAICAQB7CY3aAAAAAElFTkSuQmCC';
  manager.setURLModifier(url => /\.fbx(?:$|[?#])/i.test(url) ? url : transparent);
  const fbx=await new FBXLoader(manager).loadAsync(FBX_URL);
  fbx.updateMatrixWorld(true);
  const candidates=[];
  fbx.traverse(o=>{if(o.isMesh && !/UCX|collision/i.test(o.name)){const g=o.geometry.clone();g.applyMatrix4(o.matrixWorld);candidates.push(g)}});
  if(!candidates.length)throw new Error('Não encontrei uma malha renderizável dentro do FBX.');
  const bounds=new THREE.Box3(); candidates.forEach(g=>{g.computeBoundingBox();bounds.union(g.boundingBox)});
  const center=bounds.getCenter(new THREE.Vector3()); const size=bounds.getSize(new THREE.Vector3()); chestSize.copy(size);
  const splitY=bounds.min.y+size.y*.59;
  // No FBX deste baú, a largura maior corre no eixo Z e a profundidade
  // (frente/costas) corre no eixo X. Aqui vamos usar a dobradiça no lado
  // oposto ao anterior, para a tampa abrir pelo outro lado do baú.
  const hingeX=bounds.max.x;
  candidates.forEach(g=>{
    const parts=splitGeometry(g,splitY);
    for(const [kind,geo] of Object.entries(parts)) if(geo){
      geo.translate(-center.x,-center.y,-center.z);
      const m=new THREE.Mesh(geo,chestMat);m.castShadow=true;m.receiveShadow=true;m.userData.chest=true;hitMeshes.push(m);
      if(kind==='top')lidGroup.add(m);else bodyGroup.add(m);
    }
  });
  const norm=2.65/Math.max(size.x,size.y,size.z); chestRoot.scale.setScalar(norm);
  const py=(splitY-center.y), px=(hingeX-center.x);
  lidPivot.position.set(px,py,0); lidGroup.position.set(-px,-py,0);
  // Forro curvo acompanha a tampa porque vive dentro do lidGroup.

async function loadAlien(){
  try{
    const manager=new THREE.LoadingManager();
    const transparent='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADElEQVR42mNk+M8AAAICAQB7CY3aAAAAAElFTkSuQmCC';
    manager.setURLModifier(url=>/\.fbx(?:$|[?#])/i.test(url)?url:transparent);
    alien=await new FBXLoader(manager).loadAsync(MOB_FBX_URL);
    alien.updateMatrixWorld(true);
    // Normaliza em um wrapper. Alterar a posição do FBX diretamente misturava
    // coordenadas locais do arquivo com coordenadas do mundo e podia jogá-lo para longe.
    const box=new THREE.Box3().setFromObject(alien),sz=box.getSize(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3());
    const targetHeight=1.25,scale=targetHeight/Math.max(.001,sz.y);
    alien.scale.setScalar(scale);
    alien.position.set(-ctr.x*scale,-box.min.y*scale,-ctr.z*scale);
    const alienWrapper=new THREE.Group();
    alienWrapper.position.copy(alienHome);
    alienWrapper.add(alien);
    alien.userData.wrapper=alienWrapper;
    alien.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(!o.isSkinnedMesh)o.material=alienMat.clone();else if(o.material){o.material=o.material.clone();o.material.color?.set(0x31483d);o.material.roughness=.72;o.material.metalness=.08}}});
    alienClips=alien.animations||[];
    // Durante a calibração deixamos a pose estática para enxergar escala/orientação.
    // As animações continuam disponíveis em alienClips para religarmos depois.
    scene.add(alien.userData.wrapper||alien);
    console.info('Alien carregado.',{size:sz.toArray(),scale,animations:alienClips.map(c=>c.name)});
  }catch(e){console.warn('Não foi possível carregar o alien:',e)}
}

const gltfLoader=new GLTFLoader();
async function loadRealLoot(){
  await Promise.all(Object.entries(lootModelFiles).map(async([name,url])=>{

      const gltf=await gltfLoader.loadAsync(url);

      const box=new THREE.Box3().setFromObject(model),sz=box.getSize(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3());
      const target=lootModelScale[name]||.36;
      model.scale.setScalar(target/Math.max(sz.x,sz.y,sz.z));
      model.position.sub(ctr.multiplyScalar(model.scale.x));
      model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material=o.material.clone();if('emissive' in o.material){o.material.emissive=new THREE.Color(0x120b22);o.material.emissiveIntensity=.22}}}});
      model.visible=false;lootVisual.add(model);realLootModels[name]=model;

function damp(a,b,l,dt){return THREE.MathUtils.lerp(a,b,1-Math.exp(-l*dt))}
let last=performance.now()/1000;
function animate(){requestAnimationFrame(animate);const now=performance.now()/1000,dt=Math.min(.04,now-last);last=now;
  // WASD relativo à direção em que o jogador olha, mantendo os pés no chão.
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const move=new THREE.Vector3();
  if(keys.KeyW)move.add(forward);if(keys.KeyS)move.sub(forward);if(keys.KeyD)move.add(right);if(keys.KeyA)move.sub(right);
  if(move.lengthSq()>0){move.normalize().multiplyScalar(moveSpeed*dt);camera.position.add(move)}
  const flat=Math.hypot(camera.position.x,camera.position.z);if(flat>worldRadius){camera.position.x*=worldRadius/flat;camera.position.z*=worldRadius/flat}
  camera.position.y=playerHeight;
  // Sem movimento cinematográfico da câmera em primeira pessoa.
  // Mob congelado durante a calibração visual.

  chestFloat.position.y=Math.sin(now*1.65)*.055;
  chestFloat.rotation.y=Math.sin(now*.55)*.018;
  openProgress=damp(openProgress,openTarget,7.5,dt);
  // A tampa gira ao redor da linha esquerda-direita do baú (eixo Z),
  // agora com a dobradiça no lado oposto.
  lidPivot.rotation.x=0;
  // Com a dobradiça invertida, o sinal também precisa inverter para
  // a tampa continuar abrindo para fora do baú.
  lidPivot.rotation.z=-openProgress*1.45;
  if(ready){const pulse=isOpen?1+Math.sin((now-eventTime)*7)*.012*(1-openProgress):1;chestRoot.scale.multiplyScalar(pulse);chestRoot.scale.divideScalar(pulse)}
  const ease=Math.min(1,Math.max(0,(now-eventTime)*1.5));
  if(isOpen){const rp=rarityPower[chosen.r]||1;const targetY=.68+.10*rp;lootVisual.position.y=damp(lootVisual.position.y,targetY,3.8+rp,dt);lootVisual.position.x=chosen.r==='???'?Math.sin((now-eventTime)*24)*.055:0;lootVisual.position.z=.04;if(orb.visible)orb.material.opacity=damp(orb.material.opacity,.94,5,dt);lootVisual.rotation.x+=dt*(.8+rp*.65);lootVisual.rotation.y+=dt*(1.15+rp*1.05);const pulse=1+Math.sin((now-eventTime)*(5+rp*2))*.035*rp;lootVisual.scale.setScalar(pulse);glow.position.copy(lootVisual.position);glow.intensity=damp(glow.intensity,9+5*rp,5,dt)}else{lootVisual.position.y=damp(lootVisual.position.y,.2,5,dt);if(orb.visible)orb.material.opacity=damp(orb.material.opacity,0,6,dt);glow.intensity=damp(glow.intensity,0,6,dt)}
  ring.material.opacity=.14+Math.sin(now*2)*.04;ring.rotation.z+=dt*.05;
  emberMat.opacity=.42+Math.sin(now*2.1)*.13;embers.rotation.y+=dt*.025;
  const ep=emberGeo.attributes.position.array;for(let i=0;i<18;i++){ep[i*3+1]+=.07*dt;if(ep[i*3+1]>-.58)ep[i*3+1]=-.94}emberGeo.attributes.position.needsUpdate=true;
  const fxAge=now-fxStart;
  if(fxAge<1.25){
    const fade=Math.max(0,1-fxAge/1.25);
    // Mantém a explosão visual abaixo do baú e sobe só um pouco durante o impacto.
    fxGroup.position.y=-.72+fxAge*.10;
    rays.forEach((r,i)=>{r.material.opacity=.62*fade;r.scale.y=1+fxAge*2.8;r.rotation.y+=dt*(.35+i*.025)});
    flashMat.opacity=Math.max(0,1-fxAge*4.2);flash.scale.setScalar(1+fxAge*5);
    haloMat.opacity=.8*fade;halo.scale.setScalar(1+fxAge*5.2);
  }else{rays.forEach(r=>r.material.opacity=0);flashMat.opacity=0;haloMat.opacity=0;}
  const a=pGeo.attributes.position.array;let active=false;for(let i=0;i<particleCount;i++){if(a[i*3+1]<-50)continue;active=true;pVel[i].y-=2.4*dt;a[i*3]+=pVel[i].x*dt;a[i*3+1]+=pVel[i].y*dt;a[i*3+2]+=pVel[i].z*dt;if(a[i*3+1]<-1)a[i*3+1]=-99}if(active)pGeo.attributes.position.needsUpdate=true;pMat.opacity=damp(pMat.opacity,0,1.2,dt);
  renderer.render(scene,camera)}
animate();
